<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src blob: data:; style-src 'unsafe-inline'">
<style>
  :root {
    --bg: #161616;
    --chip: oklch(0.18 0 0 / 0.78);
    --text: oklch(0.97 0 0);
    --accent: oklch(0.62 0.2 285);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    user-select: none; cursor: grab;
    font: 12px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  body.dragging { cursor: grabbing; }
  img {
    display: block; width: 100%; height: 100%; object-fit: contain;
    pointer-events: none; -webkit-user-drag: none;
  }
  /* Thin inner line so the image edge stays visible on dark backgrounds */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.1);
  }
  body.drop-over::after { box-shadow: inset 0 0 0 2px var(--accent); }

  .close {
    position: fixed; top: 6px; right: 6px;
    width: 26px; height: 26px; border: 0; border-radius: 7px; padding: 0;
    display: grid; place-items: center;
    background: var(--chip); color: var(--text); cursor: pointer;
    opacity: 0; transition: opacity 120ms ease-out, background-color 120ms ease-out;
  }
  /* The visible button is small, but the hit area is 40px */
  .close::before { content: ""; position: absolute; inset: -7px; }
  .close:hover { background: oklch(0.55 0.2 25); }
  .close:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
  body:hover .close { opacity: 1; }
  body.dragging .close, body.tiny .close { opacity: 0; }

  .flash {
    position: fixed; left: 8px; bottom: 8px;
    padding: 6px 8px; border-radius: 6px;
    background: var(--chip); font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 160ms ease-out; pointer-events: none;
  }
  .flash.on { opacity: 1; transition-duration: 60ms; }
</style>
</head>
<body>
  <img alt="">
  <button class="close" type="button" aria-label="Close" title="Close (Esc)">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/>
    </svg>
  </button>
  <div class="flash" role="status" aria-live="polite"></div>
<script src="drop.js"></script>
<script src="pin.js"></script>
</body>
</html>
