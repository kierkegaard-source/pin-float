<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<style>
  :root {
    --accent: oklch(0.62 0.2 285);
    --accent-soft: oklch(0.62 0.2 285 / 0.55);
    --panel: oklch(0.2 0.01 285 / 0.94);
    --text: oklch(0.96 0 0);
    --muted: oklch(0.78 0.01 285);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; user-select: none;
    font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    /* Fully transparent pixels can miss mouse events, so keep a very faint background. */
    background: rgb(0 0 0 / 0.01);
  }
  .zone {
    position: absolute; inset: 0;
    display: grid; place-items: center; text-align: center;
    transition: background-color 120ms ease-out;
  }

  /* Thin strip */
  body[data-state="thin"] .zone { background: var(--accent-soft); }
  body[data-side="left"][data-state="thin"] .zone { border-radius: 0 4px 4px 0; }
  body[data-side="right"][data-state="thin"] .zone { border-radius: 4px 0 0 4px; }

  /* On hover: clickable tab */
  body[data-state="peek"] .zone { background: var(--accent); cursor: pointer; }
  body[data-side="left"][data-state="peek"] .zone { border-radius: 0 10px 10px 0; }
  body[data-side="right"][data-state="peek"] .zone { border-radius: 10px 0 0 10px; }

  /* While dragging: drop zone */
  body[data-state="open"] .zone {
    background: var(--panel);
    border: 2px dashed var(--accent);
    padding: 16px;
  }
  body[data-side="left"][data-state="open"] .zone { border-left: 0; border-radius: 0 14px 14px 0; }
  body[data-side="right"][data-state="open"] .zone { border-right: 0; border-radius: 14px 0 0 14px; }
  body[data-state="open"].over .zone { background: oklch(0.3 0.08 285 / 0.96); }

  .peek, .open { display: none; }
  body[data-state="peek"] .peek { display: block; }
  body[data-state="open"] .open { display: grid; gap: 6px; justify-items: center; }
  .open strong { font-size: 15px; font-weight: 600; }
  .open span { color: var(--muted); font-size: 12px; }
  svg { display: block; }
</style>
</head>
<body data-state="thin" data-side="left">
  <div class="zone" title="Click to pin the clipboard image. Right-click for the menu.">
    <div class="peek" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 8"/>
      </svg>
    </div>
    <div class="open">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>
      </svg>
      <strong>Drop image</strong>
      <span>Opens in a window that stays on top</span>
    </div>
  </div>
<script src="drop.js"></script>
<script src="dock.js"></script>
</body>
</html>
